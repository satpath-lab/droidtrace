[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "droidtrace"
version = "0.1.0"
description = "Instruction-level tracing of Android APKs under QEMU for malware analysis"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "satpath-lab" }]
keywords = ["android", "malware-analysis", "qemu", "dynamic-analysis", "instruction-tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "click>=8.1", "pydantic>=2.5"]

[project.optional-dependencies]
disasm  = ["capstone>=5"]
parquet = ["pyarrow>=15"]
dev     = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/satpath-lab/droidtrace"
Issues = "https://github.com/satpath-lab/droidtrace/issues"
Changelog = "https://github.com/satpath-lab/droidtrace/blob/main/CHANGELOG.md"

[project.scripts]
droidtrace = "droidtrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/droidtrace"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
