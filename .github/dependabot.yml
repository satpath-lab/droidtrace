# Keeps dependencies up to date. Updates are grouped: at most one pull request per
# ecosystem per month, instead of one per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: monthly }
