# Runs when I push a version tag (e.g. v0.1.0). It publishes:
#   1. the ready-to-use Docker image for x86_64 and arm64 -> GitHub "Packages" (ghcr.io)
#   2. the Python package files -> the GitHub "Release" page
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: echo "${{ steps.build.outputs.digest }}" > digest-${{ strategy.job-index }}.txt
      - uses: actions/upload-artifact@v4
        with: { name: "digest-${{ strategy.job-index }}", path: "digest-*.txt" }

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "digest-*", merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Publish one multi-arch image as :<version> and :latest
        run: |
          refs=$(for f in digest-*.txt; do echo -n "$IMAGE@$(cat $f) "; done)
          docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME}" -t "$IMAGE:latest" $refs

  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
